# /etc/nginx/conf.d/educaia.conf
#
# Server block COMPARTIDO del subdominio educaia.uladech.edu.pe. Cada funcionalidad
# (f1, f2, f3, ...) agrega su propio "location /fN/" DENTRO de este mismo server block:
# nginx no combina de forma fiable locations repartidas en varios server blocks que
# comparten el mismo server_name.
#
# SSL: termina AQUI, en este servidor (10.0.0.92), con un certificado colocado a mano en
# /etc/nginx/ssl/educaia.uladech.edu.pe.{crt,key} (no es de Let's Encrypt/certbot, asi que
# NO se renueva solo — hay que confirmar con quien lo emitio como se renueva antes de que
# venza). deploy/setup_root.sh (de cada funcionalidad) instala este archivo tal cual, asi
# que si se edita a mano en el servidor hay que reflejar el cambio tambien en el repo de
# la funcionalidad correspondiente para no perderlo en el siguiente despliegue.
#
# Este archivo (deploy/nginx_educaia.conf, en el repo de Funcionalidad 1) solo agrega su
# propio location /f1/ — los bloques de f2 y f3 se mantienen copiados tal cual estaban
# desplegados, sin modificarlos, para no pisar el trabajo de esos equipos.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name educaia.uladech.edu.pe;

    client_max_body_size 35m;

    ssl_certificate     /etc/nginx/ssl/educaia.uladech.edu.pe.crt;
    ssl_certificate_key /etc/nginx/ssl/educaia.uladech.edu.pe.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        return 302 /f2/gestor;
    }

    # --- Funcionalidad 2: Asistente de retroalimentacion Moodle ---
    location = /f2 {
        return 301 /f2/;
    }

    location /f2/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Funcionalidad 1: Gestor y asistentes RAG ---
    location = /f1 {
        return 301 /f1/;
    }

    location /f1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Funcionalidad 3: Gestor de evaluacion oral con IA ---
    location = /f3 {
        return 301 /f3/;
    }

    location /f3/ {
        proxy_pass http://127.0.0.1:7301;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Entrevistas con audio (Whisper) y documentos grandes: la extraccion/
        # resumen corre en workers aparte, pero la subida del audio/PDF sigue
        # siendo una peticion HTTP normal hacia el proceso web.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
